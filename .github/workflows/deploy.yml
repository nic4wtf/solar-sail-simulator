# Build and publish the simulator to GitHub Pages.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No secrets or tokens are required.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Least-privilege token scoped to Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deployment, but never cancel a
# deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run validation tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
